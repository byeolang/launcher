name: CI for stable

on:
  push:
    branches: [ stable ]
  pull_request:
    branches: [ stable ]

jobs:
  checking-code-format:
    name: check code format with clang-format
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        path:
          - check: 'module'
    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: stable 

    - name: cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-${{ hashFiles('/var/lib/apt/lists/lock') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: cache Docker packages
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt/archives
          /etc/apt/keyrings/docker.asc
        key: ${{ runner.os }}-docker-packages
        restore-keys: |
          ${{ runner.os }}-docker-

    - name: install native dependencies
      run: |
        sudo apt update
        sudo apt-get install ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        
        sudo apt-get install python3 docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

    - name: run formatter 
      run: |
        cd ${{github.workspace}} 
        python3 build/builder.py format docker

    - name: check if there is a style violiations 
      run: |
        git diff > output.txt
        if [ -s output.txt ]; then
          echo "error: some codes violates our code style."
          cat output.txt
          exit 1
        fi

  build-on-linux-clang:
    name: build on linux with clang
    runs-on: ubuntu-22.04

    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4

    - name: cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-build-${{ hashFiles('/etc/apt/sources.list.d/**') }}
        restore-keys: |
          ${{ runner.os }}-apt-build-

    - name: install native dependencies
      run: |
        sudo apt-get update
        sudo apt install -y python3 python3-pip cmake wget clang clang-format clang-tidy

    - name: build in release mode & test current codes.
      run: |
        export C=clang CXX=clang++ PYTHON=$(which python3)
        sudo $PYTHON ${{github.workspace}}/build/builder.py pub deb
        sudo $PYTHON ${{github.workspace}}/build/builder.py test

    - name: upload output files.
      uses: actions/upload-artifact@v4
      with:
        name: byeol-ubuntu-x64
        path: ${{github.workspace}}/bin/byeol-ubuntu-x64.deb

  build-on-macos:
    name: build on macos
    runs-on: macos-15

    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4

    - name: setup xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "16.4.0"

    - name: cache homebrew packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Cellar
        key: ${{ runner.os }}-brew-${{ hashFiles('**/Brewfile') }}-cmake-wget
        restore-keys: |
          ${{ runner.os }}-brew-

    - name: install native dependencies
      run: |
        brew unlink python && brew link --overwrite python
        brew uninstall --force cmake || true
        brew install cmake wget

    - name: build in release mode & test current codes.
      run: |
        export C=clang CXX=clang++ PYTHON=$(which python3)
        $PYTHON ${{github.workspace}}/build/builder.py pub mac --ignore-tidy
        $PYTHON ${{github.workspace}}/build/builder.py test --ignore-tidy

    - name: prepare upload staging
      run: |
        mkdir -p staging/byeol
        cp -r bin/* staging/byeol/
        mv staging/byeol/*.pkg staging/ || true
        [ -e staging/byeol/logs ] && rm -rf staging/byeol/logs
        [ -e staging/byeol/test ] && rm -rf staging/byeol/test

    - name: upload portable output files.
      uses: actions/upload-artifact@v4
      with:
        name: byeol-macos-arm64-portable
        path: staging/byeol/

    - name: upload pkg file
      uses: actions/upload-artifact@v4
      with:
        name: byeol-macos-arm64
        path: staging/*.pkg

  build-on-windows:
    name: build on windows
    runs-on: windows-latest

    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4

    - name: add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: cache Chocolatey packages
      uses: actions/cache@v4
      with:
        path: |
          C:\ProgramData\chocolatey\lib
          C:\Users\runneradmin\AppData\Local\Temp\chocolatey
        key: ${{ runner.os }}-choco-wget-unzip-7zip
        restore-keys: |
          ${{ runner.os }}-choco-

    - name: install apps from choco
      run: |
        choco install -y wget unzip 7zip

    - name: build in release mode
      run: |
        python ${{github.workspace}}\build\builder.py pub win

    - name: prepare portable staging
      run: |
        mkdir staging\byeol
        xcopy /E /I /Y ${{github.workspace}}\bin staging\byeol
      shell: pwsh

    - name: get advanced installer
      uses: caphyon/advinst-github-action@v2.0
      with:
        advinst-enable-automation: 'true'

    - name: build msi installer
      shell: pwsh
      run: |
        $aipPath = "${{github.workspace}}\.github\workflows\launcher.aip";
        Write-Host "AIP: $aipPath";
        $advinst = new-object -com advancedinstaller;
        $project = $advinst.LoadProject($aipPath);
        $productDetails = $project.ProductDetails;
        $productDetails.Version = $(python ${{github.workspace}}\build\builder.py ver)
        Write-Host "Version: $productDetails.Version";
        $project.Build();

    - name: upload msi file
      uses: actions/upload-artifact@v4
      with:
        name: byeol-win-x64
        path: ${{github.workspace}}\.github\workflows\byeol-win-x64.msi
