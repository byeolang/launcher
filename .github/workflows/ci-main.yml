name: CI for main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checking-code-format:
    name: check code format with clang-format
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        path:
          - check: 'module'
    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-${{ hashFiles('/var/lib/apt/lists/lock') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: cache Docker packages
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt/archives
          /etc/apt/keyrings/docker.asc
        key: ${{ runner.os }}-docker-packages
        restore-keys: |
          ${{ runner.os }}-docker-

    - name: install native dependencies
      run: |
        sudo apt update
        sudo apt-get install ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        
        sudo apt-get install python3 docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

    - name: run formatter 
      run: |
        cd ${{github.workspace}} 
        python3 build/builder.py format docker

    - name: check if there is a style violiations 
      run: |
        git diff > output.txt
        if [ -s output.txt ]; then
          echo "error: some codes violates our code style."
          cat output.txt
          exit 1
        fi

  build-on-linux-clang:
    name: build on linux with clang
    runs-on: ubuntu-22.04

    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4

    - name: cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-build-${{ hashFiles('/etc/apt/sources.list.d/**') }}
        restore-keys: |
          ${{ runner.os }}-apt-build-

    - name: install native dependencies
      run: |
        sudo apt-get update
        sudo apt install -y python3 python3-pip cmake wget clang clang-format clang-tidy libssl-dev

    - name: build in release mode & test current codes.
      run: |
        export C=clang CXX=clang++ PYTHON=$(which python3)
        sudo $PYTHON ${{github.workspace}}/build/builder.py rel
        sudo $PYTHON ${{github.workspace}}/build/builder.py test

    - name: upload output files.
      uses: actions/upload-artifact@v4
      with:
        name: byeol-ubuntu-x64
        path: ${{github.workspace}}/bin/byeol

  build-on-linux-gcc:
    name: build on linux with gcc
    runs-on: ubuntu-22.04

    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4

    - name: cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-gcc-build
        restore-keys: |
          ${{ runner.os }}-apt-build-

    - name: install native dependencies
      run: |
        sudo apt-get update
        sudo apt install -y python3 python3-pip cmake wget libssl-dev

    - name: remove clang
      run: |
        which clang++ && sudo mv $(which clang++) /tmp || true

    - name: build in release mode & test current codes.
      run: |
        export C=clang CXX=clang++ PYTHON=$(which python3)
        sudo $PYTHON ${{github.workspace}}/build/builder.py rel
        sudo $PYTHON ${{github.workspace}}/build/builder.py test

  measure-coverage:
    needs: [build-on-linux-clang]
    name: measure code coverage
    runs-on: ubuntu-22.04

    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4

    - name: cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-coverage-${{ hashFiles('/etc/apt/sources.list') }}
        restore-keys: |
          ${{ runner.os }}-apt-coverage-

    - name: cache lcov source
      uses: actions/cache@v4
      id: lcov-source-cache
      with:
        path: lcov-2.2.tar.gz
        key: lcov-source-2.2

    - name: cache lcov binary
      uses: actions/cache@v4
      id: lcov-binary-cache
      with:
        path: |
          /usr/local/bin/lcov
          /usr/local/bin/genhtml
          /usr/local/bin/geninfo
          /usr/local/bin/genpng
          /usr/local/bin/gendesc
          /usr/local/bin/lcov_cobertura.py
          /usr/local/share/man/man1/lcov*.1
          /usr/local/share/man/man1/genhtml.1
          /usr/local/share/man/man1/geninfo.1
          /usr/local/share/man/man5/lcovrc.5
          /usr/local/etc/lcovrc
          /usr/local/share/lcov
        key: ${{ runner.os }}-lcov-binary-2.2

    - name: install native dependencies
      run: |
        sudo apt-get update
        sudo apt install -y python3 python3-pip cmake wget clang-format clang-tidy llvm perl libcapture-tiny-perl libdatetime-perl libjson-xs-perl

    - name: download lcov source
      if: steps.lcov-source-cache.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/linux-test-project/lcov/releases/download/v2.2/lcov-2.2.tar.gz

    - name: build and install lcov
      if: steps.lcov-binary-cache.outputs.cache-hit != 'true'
      run: |
        tar -zxvf lcov-2.2.tar.gz
        cd lcov-2.2
        sudo make install
        cd ..
        sudo rm -rf lcov-2.2

    - name: verify lcov version
      run: |
        lcov --version

    - name: build for measuring coverage
      run: |
        export C=clang CXX=clang++ PYTHON=$(which python3)
        sudo $PYTHON ${{github.workspace}}/build/builder.py cov

    - name: upload coverage report to codecov
      uses: codecov/codecov-action@v5.5.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/cov.info

  build-on-macos:
    name: build on macos
    runs-on: macos-15

    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4

    - name: setup xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "16.4.0"

    - name: cache homebrew packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Cellar
        key: ${{ runner.os }}-brew-${{ hashFiles('**/Brewfile') }}-cmake-wget
        restore-keys: |
          ${{ runner.os }}-brew-

    - name: install native dependencies
      run: |
        brew unlink python && brew link --overwrite python
        brew uninstall --force cmake || true
        brew install cmake wget graphviz

    - name: build in release mode & test current codes.
      run: |
        export C=clang CXX=clang++ PYTHON=$(which python3)
        $PYTHON ${{github.workspace}}/build/builder.py rel --ignore-tidy
        $PYTHON ${{github.workspace}}/build/builder.py test --ignore-tidy

    - name: upload output files.
      uses: actions/upload-artifact@v4
      with:
        name: byeol-macos-arm64
        path: ${{github.workspace}}/bin/byeol

  build-on-windows:
    name: build on windows
    runs-on: windows-2022

    steps:
    - name: checkout repository codes
      uses: actions/checkout@v4

    - name: add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: cache Chocolatey packages
      uses: actions/cache@v4
      with:
        path: |
          C:\ProgramData\chocolatey\lib
          C:\Users\runneradmin\AppData\Local\Temp\chocolatey
        key: ${{ runner.os }}-choco-wget-unzip-7zip
        restore-keys: |
          ${{ runner.os }}-choco-

    - name: install apps from choco
      run: |
        choco install -y wget unzip 7zip

    - name: build in release mode
      run: |
        python ${{github.workspace}}\build\builder.py rel

    - name: upload output files.
      uses: actions/upload-artifact@v4
      with:
        name: byeol-win-x64
        path: ${{github.workspace}}\bin\byeol.exe
